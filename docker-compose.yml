services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - songnet
    restart: unless-stopped

  db_api:
    build: ./db_api
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db
    networks:
      - songnet
    restart: unless-stopped

  bot:
    build: ./bot
    environment:
      DB_API_URL: ${DB_API_URL}
      TOKEN: ${TOKEN}
      WORKER_URL: ${WORKER_URL:-http://worker:8002}
    depends_on:
      - db_api
      - worker
    networks:
      - songnet
    restart: unless-stopped

  worker:
    build: ./worker
    environment:
      API_KEY: ${API_KEY}
    networks:
      - songnet
    restart: unless-stopped

  web:
    build: ./web
    environment:
      DB_API_URL: ${DB_API_URL}
      WORKER_URL: ${WORKER_URL:-http://worker:8002}
    ports:
      - "8501:8501"
    depends_on:
      - db_api
      - worker
    networks:
      - songnet
    restart: unless-stopped

networks:
  songnet:
    driver: bridge

volumes:
  postgres_data:
    driver: local